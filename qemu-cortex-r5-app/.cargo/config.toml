[target.armv7r-none-eabihf]
rustflags = [
    "-Clink-arg=-Tlinker.ld",
    "-Clink-arg=-Tdefmt.x",
    "-Ctarget-cpu=cortex-r5",
]
runner = [
    "qemu-run",
    "--machine=versatileab",
    "--cpu=cortex-r5f",
    "--log-format={[{L}]%bold} {s} {({c:bold} {fff}:{l:1})%dimmed}"
]

[build]
target = ["armv7r-none-eabihf"]

[env]
DEFMT_LOG = "debug"
