[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip nRF52840_xxAA --allow-erase-all --log-format=oneline"

[build]
# cross-compile to this target
target = "thumbv7em-none-eabihf" # = ARM Cortex-M4 with hard-float

[env]
DEFMT_LOG = "debug"
