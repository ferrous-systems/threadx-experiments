[package]
authors = ["Jonathan Pallant <jonathan.pallant@ferrous-systems.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
name = "stm32u5-app"
version = "0.0.0"
description = "Rust ThreadX demo on STM32U5A5 in Nonsecure State"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
stm32u5 = { version = "0.16.0", features = ["stm32u5a5"] }
heapless = "0.9"
defmt = "1.0"
defmt-rtt = "1.0"
threadx-sys = { path = "../threadx-sys" }
byte-strings = "0.3.1"
static_cell = "2.0.0"
critical-section = "1.2.0"
embedded-hal = "1.0"
semihosting = "0.1.25"

# optimize code in both profiles
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true # !
incremental = false
lto = "fat"
opt-level = 'z' # !
overflow-checks = false

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false

[build-dependencies]
cc = "1.0.83"
