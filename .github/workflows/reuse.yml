name: workflow-code-licensing
run-name: Check code licensing
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
jobs:
  job-run-reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Install tools
        run: |
          pipx install reuse
      - name: Check Licensing
        run: |
          reuse lint
