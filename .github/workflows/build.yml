name: workflow-check-with-upstream
run-name: Check with Upstream
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
jobs:
  job-build:
    strategy:
      matrix:
        build:
          - package: nrf52-app
            target: thumbv7em-none-eabihf
          - package: qemu-cortex-r5-app
            target: armv7r-none-eabihf
    runs-on: ubuntu-latest
    steps:
      - name: Install Arm C compiler
        run: |
          sudo apt-get update -y && sudo apt-get -y install gcc-arm-none-eabi
      - name: Install tools
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/knurling-rs/flip-link/releases/download/v0.1.12/flip-link-installer.sh | sh
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: "true"
      - name: Add rustup target
        run: |
          rustup target add ${{ matrix.build.target }}
      - name: Find slug name
        run: |
          slug=$(./describe.sh "${GITHUB_REF}")
          echo "Building with slug '${slug}'"
          echo "BUILD_SLUG=${slug}" >> "${GITHUB_ENV}"
      - name: Build
        run: |
          cd ${{ matrix.build.package }}
          cargo build --target=${{ matrix.build.target }} --release
      - name: Upload ${{ matrix.build.package }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build.package }}
          path: ${{ matrix.build.package }}/target/${{ matrix.build.target }}/release/${{ matrix.build.package }}
  job-run-reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install tools
        run: |
          pipx install reuse
      - name: Check Licensing
        run: |
          reuse lint
  job-clippy:
    strategy:
      matrix:
        build:
          - package: nrf52-app
            target: thumbv7em-none-eabihf
          - package: qemu-cortex-r5-app
            target: armv7r-none-eabihf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: "true"
      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get -y install gcc-arm-none-eabi
      - name: Add rustup target
        run: |
          rustup target add ${{ matrix.build.target }}
      - name: Check Clippy
        run: |
          cd ${{ matrix.build.package }}
          cargo clippy --all-features
  job-format:
    strategy:
      matrix:
        build:
          - package: nrf52-app
          - package: qemu-cortex-r5-app
          - package: threadx-sys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Check Formatting
        run: |
          cd ${{ matrix.build.package }}
          cargo fmt -- --check

  job-all:
    runs-on: ubuntu-latest
    if: always()
    # NOTE: Jobs that must pass this workflow must be listed here
    needs:
      - job-build
      - job-run-reuse-lint
      - job-format
    timeout-minutes: 2
    steps:
      # Taken from: https://github.com/orgs/community/discussions/75568#discussioncomment-10351973
      - name: Ensure all required jobs succeed
        run: |
          echo "Our needs:"
          echo '${{ toJSON(needs) }}'
          echo "Checking..."
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
