name: workflow-code-analysis
run-name: Run code analysis
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
jobs:
  job-clippy:
    strategy:
      matrix:
        build:
          - package: nrf52-app
            target: thumbv7em-none-eabihf
          - package: qemu-cortex-r5-app
            target: armv7r-none-eabihf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get -y install gcc-arm-none-eabi
      - name: Add rustup target
        run: |
          rustup target add ${{ matrix.build.target }}
      - name: Check Clippy
        run: |
          cd ${{ matrix.build.package }}
          cargo clippy --all-features
